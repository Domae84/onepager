<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--SEO_HEAD-->

<link rel="shortcut icon" href="/icon/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <div class="nav-mark">es</div>
    <div class="nav-brand-name"><span>espitalier</span><span>solutions</span></div>
  </div>
  <div class="nav-links">
    <a href="#skills" data-i18n="nav.skills"></a>
    <a href="#projekte" data-i18n="nav.projects"></a>
    <a href="#profil" data-i18n="nav.profile"></a>
    <a href="#kontakt" data-i18n="nav.contact"></a>
  </div>
  <div class="nav-actions">
    <div class="lang-toggle" role="group" aria-label="Sprache wählen">
      <a data-lang-btn="de" href="/">DE</a>
      <a data-lang-btn="en" href="/en/">EN</a>
    </div>
  </div>
</nav>

<header id="profil" class="container hero">
  <div>
    <div class="hero-badge">
      <span class="hero-badge-dot"></span>
      <span data-i18n="hero.badge"></span>
    </div>
    <h1 data-i18n="hero.name"></h1>
    <p class="hero-title" data-i18n="hero.title"></p>
    <p class="hero-intro" data-i18n="hero.intro"></p>
    <div class="hero-ctas">
      <a class="btn btn-primary" id="cv-pdf-link" href="/documents/CV-Dominik-Espitalier-DE.pdf" download>
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 9.5 10 14l4.5-4.5M4 17h12"/></svg>
        <span data-i18n="hero.ctaPdf"></span>
      </a>
      <a class="btn btn-secondary" id="cv-docx-link" href="/documents/CV-Dominik-Espitalier-DE.docx" download>
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 9.5 10 14l4.5-4.5M4 17h12"/></svg>
        <span data-i18n="hero.ctaDocx"></span>
      </a>
    </div>
    <div class="hero-contact">
      <div class="hero-contact-item">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h3l2 5-2.5 1.5a10 10 0 0 0 5 5L13 13l5 2v3a1.5 1.5 0 0 1-1.6 1.5C9.5 19 3 12.5 2.5 5.6A1.5 1.5 0 0 1 4 4z"/></svg>
        <a href="tel:+4915120196267">+49 151 20196267</a>
      </div>
      <div class="hero-contact-item">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><path d="m3 5.5 7 5.5 7-5.5"/></svg>
        <a href="mailto:dominik@espitalier-solutions.de">dominik@espitalier-solutions.de</a>
      </div>
      <div class="hero-contact-item">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18s6-5.6 6-10a6 6 0 1 0-12 0c0 4.4 6 10 6 10z"/><circle cx="10" cy="8" r="2.2"/></svg>
        <span data-i18n="hero.location"></span>
      </div>
    </div>
  </div>
  <div class="hero-photo">
    <div class="hero-photo-frame">
      <img src="/images/profile_new.jpg" alt="Dominik Espitalier" width="280" height="420">
    </div>
  </div>
</header>

<section id="skills" class="skills">
  <div class="container skills-inner">
    <span class="section-eyebrow" data-i18n="skills.eyebrow"></span>
    <h2 class="section-title" data-i18n="skills.title"></h2>

    <h3 class="skills-subtitle" data-i18n="skills.coreTitle"></h3>
    <div id="core-columns" class="core-columns"></div>

    <h3 class="skills-subtitle skills-subtitle-more" data-i18n="skills.moreTitle"></h3>
    <div id="skills-groups"></div>
  </div>
</section>

<section id="projekte" class="timeline-section">
  <div class="container">
    <span class="section-eyebrow" data-i18n="timeline.eyebrow"></span>
    <h2 class="section-title" data-i18n="timeline.title"></h2>
    <p class="section-subtitle" data-i18n="timeline.subtitle"></p>
    <div class="timeline">
      <div class="timeline-line"></div>
      <div id="timeline-items"></div>
    </div>
    <button type="button" class="earlier-toggle" id="earlier-toggle" aria-expanded="false">
      <span id="earlier-toggle-label"></span>
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7.5 5 5 5-5"/></svg>
    </button>
    <ul class="earlier-list" id="earlier-items" hidden></ul>
  </div>
</section>

<section class="info">
  <div class="container info-inner">
    <div class="info-col">
      <h3 data-i18n="info.educationTitle"></h3>
      <p class="strong" data-i18n="info.educationName"></p>
      <p data-i18n="info.educationDegree"></p>
    </div>
    <div class="info-col">
      <h3 data-i18n="info.certTitle"></h3>
      <div class="cert-list" id="cert-list"></div>
    </div>
    <div class="info-col">
      <h3 data-i18n="info.interestsTitle"></h3>
      <div class="interest-list" id="interest-list"></div>
    </div>
  </div>
</section>

<footer id="kontakt" class="footer">
  <div class="container footer-inner">
    <div>
      <div class="footer-brand">
        <div class="footer-mark">es</div>
        <span class="footer-brand-name">espitalier solutions</span>
      </div>
      <div class="footer-address">
        <p data-i18n="contact.addressLine"></p>
        <p data-i18n="contact.site"></p>
      </div>
    </div>
    <div class="footer-contact">
      <div class="footer-contact-item">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h3l2 5-2.5 1.5a10 10 0 0 0 5 5L13 13l5 2v3a1.5 1.5 0 0 1-1.6 1.5C9.5 19 3 12.5 2.5 5.6A1.5 1.5 0 0 1 4 4z"/></svg>
        <a href="tel:+4915120196267">+49 151 20196267</a>
      </div>
      <div class="footer-contact-item">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><path d="m3 5.5 7 5.5 7-5.5"/></svg>
        <a href="mailto:dominik@espitalier-solutions.de">dominik@espitalier-solutions.de</a>
      </div>
    </div>
  </div>
  <div class="footer-bottom" data-i18n="contact.copyright"></div>
</footer>

<script src="/js/content.js"></script>
<script src="/js/render.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
